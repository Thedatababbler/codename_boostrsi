# Single-agent Boosted Workflow on the real Farm benchmark, d5 (revision §12; plan of 2026-11-27).
# Everything is generated on this cluster from scratch (no multi-agent cache): y0 and every baseline. Server settings
# are identical on every server and the GPU type is part of the cache tag: Qwen3-14B, thinking on, temperature 0.7,
# max_tokens 30000, --max-model-len 40960, --kv-cache-dtype fp8, H200 (slurm/serve_and_run.sbatch).
# api_base is filled in by the Slurm job (a comma list of its servers; requests are routed by item).
seed: 0
lam: auto
accept_margin: 0.01
llm:
  kind: openai
  api_base: http://127.0.0.1:8401/v1   # placeholder, set by slurm/serve_and_run.sbatch
  model: qwen3-14b
  temperature: 0.7
  max_tokens: 30000
  max_concurrency: 24
  timeout: 7200
  extra_body: {chat_template_kwargs: {enable_thinking: true}}
  cache_tag: kvfp8-h200
  y0_cache_tags: []
cache_dir: cache
bench:
  game: farm
  train:   {difficulty: 5, seeds: [1000, 1012]}
  heldout: {difficulty: 5, seeds: [2000, 2030]}
  dev_tests:
    test_d5: {difficulty: 5, seeds: [6000, 6040]}   # seeds 6000-6039 (half-open); the pre-check split
  final_tests: {}   # final-test seeds 9000-9009 are never generated
workflow:
  seed_scheme: path        # path (new structures) | legacy (multi-agent repeat indices; replay baselines)
  diag_mode: clean         # clean | original (replay check only, never in a new comparison)
  start: y0                # y0 | empty (kept for later; not run)
  max_calls: 12
  require_cached_y0: []   # y0 is generated here
boost:
  rounds: 4
  patience: 2
  max_steps: 4
  top_k: 3
  fresh_after_reject: true
search: {min_gain: 0.005}
