# Calibration with thinking mode on (same model / endpoint / temperature; longer budget for the reasoning).
bench: {game: farm}
llm:
  kind: openai
  api_base: http://127.0.0.1:8401/v1
  model: qwen3-14b
  temperature: 0.7
  max_tokens: 13000
  max_concurrency: 24
  timeout: 3600
  extra_body: {chat_template_kwargs: {enable_thinking: true}}
calibration: {seed_start: 6000}
