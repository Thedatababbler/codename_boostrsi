# Round-4 Part 1: thinking on, with a budget that does not truncate (server started with --max-model-len 40960).
bench: {game: farm}
llm:
  kind: openai
  api_base: http://127.0.0.1:8401/v1
  model: qwen3-14b
  temperature: 0.7
  max_tokens: 30000
  max_concurrency: 16
  timeout: 7200
  extra_body: {chat_template_kwargs: {enable_thinking: true}}
calibration: {seed_start: 6000}
